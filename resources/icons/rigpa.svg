  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E08050"/>
      <stop offset="1" stop-color="#D07040"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80B0D0"/>
      <stop offset="1" stop-color="#70A0C0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="512" width="894" height="64" rx="32" fill="#555555"/>
  <g transform="translate(206, 352)">
    <rect width="256" height="384" rx="48" fill="url(#orange)"/>
    <circle cx="128" cy="316" r="30" fill="#eee"/>
    <circle cx="56" cy="96" r="30" fill="#333"/>
    <circle cx="128" cy="96" r="30" fill="#333"/>
    <circle cx="200" cy="96" r="30" fill="#333"/>
  </g>
  <g transform="translate(576, 352)">
    <rect width="256" height="384" rx="48" fill="url(#blue)"/>
    <circle cx="128" cy="316" r="30" fill="#eee"/>
    <circle cx="56" cy="96" r="30" fill="#333"/>
    <circle cx="128" cy="96" r="30" fill="#333"/>
    <circle cx="200" cy="96" r="30" fill="#333"/>
